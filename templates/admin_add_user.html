<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Adicionar Utilizador</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --accent-color: #ff9800;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            max-width: 1200px;
            margin: auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-secondary,
        .btn-login {
            text-decoration: none;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
            color: white;
            background-color: var(--primary-color);
        }

        .btn-login {
            background-color: transparent;
            color: var(--primary-color);
        }

        .btn-secondary:hover,
        .btn-login:hover {
            background-color: #003d82;
            color: white;
        }

        .page-title {
            margin-top: 110px;
            text-align: center;
            font-size: 2.5rem;
            color: var(--primary-color);
            padding: 20px 5%;
        }

        .content {
            padding: 20px 5% 60px;
            max-width: 700px;
            margin: auto;
        }

        .section-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .section-card h2 {
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
        }

        .button-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn-primary,
        .btn-cancel {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-cancel {
            background-color: #f0f4f8;
            color: var(--text-color);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 40px 20px;
            margin-top: 30px;
        }

        .team-info {
            font-size: 0.9rem;
            color: #bdc3c7;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="/admin" class="logo">EST<span>box</span> Admin</a>
            <div class="nav-buttons">
                <a href="/admin/users" class="btn-secondary">Gerir Utilizadores</a>
                <a href="/admin/vehicles" class="btn-secondary">Gerir Veículos</a>
                <a href="/conta" class="btn-secondary">Conta</a>
                <a href="/logout" class="btn-login">Logout</a>
            </div>
        </nav>
    </header>

    <h1 class="page-title">Adicionar Utilizador</h1>

    <main class="content">
        <div class="section-card">
            <h2>Novo Utilizador</h2>
            <form method="post" action="{{ url_for('admin_add_user') }}">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required>
                </div>

                <div class="form-group">
                    <label for="role">Função</label>
                    <select id="role" name="role" required>
                        <option value="utilizador">Utilizador</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <div class="button-row">
                    <button type="submit" class="btn-primary">Criar Utilizador</button>
                    <a href="{{ url_for('admin_users') }}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="team-info">
            <p>Desenvolvido por: Diogo Santos, João Mendonça e Martim Carvalho</p>
        </div>
    </footer>
</body>
</html>
